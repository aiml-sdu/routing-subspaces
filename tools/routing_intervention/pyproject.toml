[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-intervention"
version = "0.1.0"
description = "Automated routing-direction causal intervention on fine-tuned LoRA models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Phongsakon Mark Konrad"}, {name = "Toygar Tanyel"}, {name = "Serkan Ayvaz"},
]
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
routing-intervention = "routing_intervention.cli:main"

[tool.setuptools]
packages = ["routing_intervention"]
